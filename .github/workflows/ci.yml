name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow builds and tests, it never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: Build and test (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Locked mode: the build fails if a lock file is out of date instead of silently resolving new versions.
      - name: Restore
        run: dotnet restore JetQueries.slnx --locked-mode

      # Warnings are errors (Directory.Build.props), so this is also the analyzer and style gate.
      - name: Build
        run: dotnet build JetQueries.slnx -c Release --no-restore

      # Includes the performance-budget tests (grid render time). Integration tests skip without Docker.
      - name: Test
        run: dotnet test JetQueries.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  package:
    name: Package (win-x64)
    needs: build-test
    # Packages are built from main and from version tags only, never from pull requests.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the version from tags and commit height: it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Unsigned until a code-signing certificate is available; nothing is published from here yet.
      - name: Pack
        shell: pwsh
        run: scripts/pack.ps1 -Channel ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'nightly' }}

      # CLAUDE.md budgets on the published build: window shown under 1.5 s, idle memory under 200 MB (software
      # rendering; the runner has no GPU).
      - name: Performance budgets
        shell: pwsh
        env:
          JETQUERIES_BUDGET_EXE: ${{ github.workspace }}\artifacts\publish\win-x64\JetQueries.exe
        run: dotnet test tests/JetQueries.Wpf.Tests -c Release --filter "FullyQualifiedName~BudgetTests&DisplayName~software"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: jetqueries-win-x64
          path: artifacts/releases/win-x64
          if-no-files-found: error
          retention-days: 14
